name: Deploy Snake Battle to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".last_build_id"
      - "assets/**"
      - "canvaskit/**"
      - "favicon.png"
      - "flutter*.js"
      - ".github/workflows/deploy-pages.yml"
      - "icons/**"
      - "index.html"
      - "main.dart.js"
      - "manifest.json"
      - "version.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
