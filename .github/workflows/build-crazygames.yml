name: Build CrazyGames package

on:
  push:
    branches: [main]
    paths:
      - "Snake_Battle_CrazyGames_Repaired.zip"
      - ".github/workflows/build-crazygames.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZIP tools and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          node --version
          npm --version

      - name: Extract and validate CrazyGames package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="Snake_Battle_CrazyGames_Repaired.zip"
          test -s "$SOURCE"
          unzip -t "$SOURCE"
          mkdir -p work dist
          unzip -q "$SOURCE" -d work
          test -s work/index.html
          test -s work/main.dart.js
          test -s work/flutter_bootstrap.js
          test -d work/canvaskit
          grep -Fq 'https://sdk.crazygames.com/crazygames-sdk-v3.js' work/index.html
          grep -Fq 'await current.init()' work/index.html
          grep -Fq 'game.loadingStart()' work/index.html
          grep -Fq 'game.gameplayStart()' work/index.html
          grep -Fq 'current.ad.requestAd("midgame"' work/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("work/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline CrazyGames integration script found")
          Path("/tmp/crazygames-inline.js").write_text("\n".join(inline))
          Path("dist/FLUTTER_BOOTSTRAP_HEAD.txt").write_text(Path("work/flutter_bootstrap.js").read_text()[:12000])
          PY
          node --check /tmp/crazygames-inline.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory work >/tmp/crazygames-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const report = [];
            for (const profile of [
              {name:'desktop', viewport:{width:1365,height:768}, isMobile:false, hasTouch:false},
              {name:'mobile', viewport:{width:390,height:844}, isMobile:true, hasTouch:true},
              {name:'mobile-landscape', viewport:{width:844,height:390}, isMobile:true, hasTouch:true}
            ]) {
              const context = await browser.newContext({...profile, deviceScaleFactor:1});
              const page = await context.newPage();
              const errors = [];
              const failed = [];
              page.on('pageerror', e => errors.push({message:String(e),stack:e.stack||null}));
              page.on('console', m => { if (m.type()==='error') errors.push({message:m.text(),stack:null}); });
              page.on('requestfailed', r => failed.push({url:r.url(), error:r.failure()?.errorText}));
              await page.goto('http://127.0.0.1:8765/index.html', {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(20000);
              const state = await page.evaluate(() => {
                const canvases = [...document.querySelectorAll('canvas')].map(c => {
                  const r=c.getBoundingClientRect();
                  return {width:c.width,height:c.height,rect:{x:r.x,y:r.y,width:r.width,height:r.height}};
                });
                const fv=document.querySelector('flutter-view');
                const r=fv?.getBoundingClientRect();
                return {
                  title:document.title,
                  bodySize:{width:document.body.scrollWidth,height:document.body.scrollHeight},
                  readyState:document.readyState,
                  bodyExists:!!document.body,
                  flutterView:!!fv,
                  flutterRect:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null,
                  canvases,
                  sdkPresent:!!(window.CrazyGames&&window.CrazyGames.SDK),
                  sdkBridge:!!window.PokiSDK
                };
              });
              await page.screenshot({path:'dist/'+profile.name+'-qa.png', fullPage:true}).catch(()=>{});
              report.push({profile:profile.name,state,errors,failedRequests:failed});
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('dist/QA_REPORT.json', JSON.stringify(report,null,2));
            const lines=['# CrazyGames browser QA',''];
            for (const x of report) {
              lines.push('## '+x.profile, '', 'STATE JSON:', JSON.stringify(x.state,null,2),
                '', '### JavaScript/console errors', ...((x.errors.length?x.errors.map(e=>e.message+'\\n'+(e.stack||'')):['None observed']).map(e=>'- '+e)),
                '', '### Failed requests', ...((x.failedRequests.length?x.failedRequests.map(e=>'- '+e.url+' — '+e.error):['None observed'])), '');
            }
            fs.writeFileSync('dist/QA_REPORT.md', lines.join('\\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Check reward-ad implementation markers
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Reward-ad inspection"
            echo
            echo "## CrazyGames integration"
            grep -nE 'requestAd|commercialBreak|reward|midgame' work/index.html || true
            echo
            echo "## Compiled game references"
            strings work/main.dart.js | grep -iE 'reward|watch.*ad|admob|google.?mobile|show.?ad|video.?ad|bonus|commercialBreak|PokiSDK' | head -100 || true
          } > dist/REWARD_INSPECTION.md

      - name: Repackage final CrazyGames ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd work && zip -qr -9 ../dist/Snake_Battle_CrazyGames.zip .)
          unzip -t dist/Snake_Battle_CrazyGames.zip
          sha256sum Snake_Battle_CrazyGames_Repaired.zip dist/Snake_Battle_CrazyGames.zip | tee dist/SHA256SUMS.txt

      - name: Publish QA report to repository
        shell: bash
        run: |
          mkdir -p .github/qa
          cp dist/QA_REPORT.md .github/qa/crazygames-browser-qa.md
          cp dist/REWARD_INSPECTION.md .github/qa/crazygames-reward-inspection.md
          cp dist/FLUTTER_BOOTSTRAP_HEAD.txt .github/qa/flutter-bootstrap-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Add detailed CrazyGames browser diagnostics"
            git push
          fi

      - name: Upload final CrazyGames package and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Battle-CrazyGames
          path: |
            dist/Snake_Battle_CrazyGames.zip
            dist/SHA256SUMS.txt
            dist/QA_REPORT.json
            dist/desktop-qa.png
            dist/mobile-qa.png
            dist/REWARD_INSPECTION.md
            dist/FLUTTER_BOOTSTRAP_HEAD.txt
          if-no-files-found: error
          retention-days: 30
